# Installed to /etc/systemd/logind.conf.d/20-lid-lock.conf
#
# What closing the lid means. The shipped default is `suspend`, and on this
# machine that is the only thing in the entire session that stops a running
# process: systemd-sleep freezes the whole of user.slice on the way down
# ("Successfully froze unit 'user.slice'" in the journal, immediately before
# "Performing sleep operation 'suspend'") and thaws it on resume.
#
# Nothing else that looks like it should stop a process actually does.
# Super+Alt+L only raises a lock screen. Mod+Shift+P only powers the output
# off. Neither touches a single PID. So the lid was the one place where the
# session's behaviour disagreed with the rule this file enforces: locking and
# blanking leave work running, and only an explicit sleep stops it.
#
# With `lock`, a download, a build or a sync keeps running with the lid shut.
#
# `lock` is a reachable action here because noctalia registers a logind session
# lock listener at startup ("logind session lock monitor active") and reports
# back through SetLockedHint; this is the same signal `loginctl lock-session`
# sends. niri powers the internal output down on lid close on its own, so the
# screen-off half of the behaviour needs nothing configured.
#
# THE COST, which is real and was accepted deliberately: nothing will sleep
# this laptop by itself any more. IdleAction is logind's `ignore` default, and
# all three of noctalia's idle behaviours are `enabled = false` in
# settings.toml, so there is no timeout anywhere that will take over. A machine
# shut in a bag stays awake, gets warm and flattens the battery. Sleeping is
# now entirely a manual act: the session menu, or `systemctl suspend`.
#
# IT ALSO COSTS NOLOCK THE LID. "nolock on, shut the lid, open it straight back
# into the session" no longer works: nolock turns off the switches on the sleep
# path, and the lid is not on that path any more, so lock_before_suspend never
# gets consulted. The prompt now comes from logind's own `lock`, gated only by
# noctalia's lockscreen.enabled master switch, which nolock leaves alone.
#
# Put the stock behaviour back by setting HandleLidSwitch=suspend here, or by
# deleting this file, then `systemctl reload systemd-logind`.
#
# HandleLidSwitchDocked is deliberately left at its `ignore` default: docked
# means an external screen is attached, and locking the session then would
# interrupt work that is still perfectly visible.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
