# Installed to /etc/systemd/logind.conf.d/10-inhibit-delay.conf
#
# How long logind waits for delay inhibitors to be released before it suspends
# regardless. The shipped default is 5 seconds.
#
# xfce4-screensaver takes one of these on every sleep so it can raise the lock
# screen first. Five seconds is a comfortable budget on a machine with memory
# to spare and a very tight one here: 3.4 GB of RAM, swappiness 150, and a
# desktop that has usually been paged out to the swapfile by the time the lid
# closes. Miss the deadline and logind suspends mid-lock, freezing user.slice
# with the screensaver holding an X keyboard grab it never finished — the
# keyboard is then dead session-wide until something kills that client.
#
# 30s is the cost ceiling, not the cost: the inhibitor is released as soon as
# the lock is up, so a suspend that was taking 0.3s still takes 0.3s. It only
# spends the extra when the alternative is the wedge.
[Login]
InhibitDelayMaxSec=30
