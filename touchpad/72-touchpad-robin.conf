# Robin's touchpad tweaks (Windows 11 feel). Loads after the distro's
# 70-synaptics.conf and overrides it. Edit values here, not in /usr/share.
Section "InputClass"
    Identifier "robin touchpad tweaks"
    MatchIsTouchpad "on"
    MatchDriver "synaptics"
    # Natural / reversed scrolling (negative delta flips the direction)
    Option "VertScrollDelta"      "-100"
    Option "HorizScrollDelta"     "-100"
    # Smooth two-finger scrolling
    Option "VertTwoFingerScroll"  "1"
    Option "HorizTwoFingerScroll" "1"
    # Tap-to-click: 1 finger = left, 2 = right, 3 = middle
    Option "TapButton1"           "1"
    Option "TapButton2"           "3"
    Option "TapButton3"           "2"
    # Palm rejection
    Option "PalmDetect"           "1"
    # Locked drags: the modern replacement for edge motion. Lift and re-touch
    # to continue a drag. Short timeout (ms) so it releases fast when you stop.
    Option "TapAndDragGesture"    "1"
    Option "LockedDrags"          "1"
    Option "LockedDragTimeout"    "165"
EndSection
