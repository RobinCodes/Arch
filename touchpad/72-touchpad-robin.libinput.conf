# Robin's touchpad -> force the modern libinput driver for smooth, Windows-11-
# like pixel scrolling. Copied to /etc/X11/xorg.conf.d/72-touchpad-robin.conf by
# switch-to-libinput.sh. Sorts after 70-synaptics.conf so libinput wins even
# though xf86-input-synaptics is still installed.
#
# Edge motion is provided separately by the driver-independent edge-motion
# systemd service, so it keeps working under libinput.
Section "InputClass"
    Identifier "robin touchpad libinput"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    # Tap-to-click, 1=left 2=right 3=middle
    Option "Tapping"            "true"
    Option "TappingButtonMap"   "lrm"
    # Tap-and-drag with drag lock: lift, reposition, and continue the drag/select
    # (the "release-reposition-continue" chain). Drag stays held across finger
    # lifts until you tap to release.
    Option "TappingDrag"        "true"
    Option "TappingDragLock"    "true"
    # Natural / reversed scrolling, smooth two-finger
    Option "NaturalScrolling"   "true"
    Option "ScrollMethod"       "twofinger"
    # Physical click: bottom-right corner = right-click (Windows-like)
    Option "ClickMethod"        "buttonareas"
    Option "DisableWhileTyping" "true"
EndSection
