# OOM Defender — installed to /etc/oom-defender.conf
#
# Edit and `sudo systemctl reload oom-defender` to apply (SIGHUP, no restart,
# so nothing currently frozen is forgotten about).
#
# Every threshold below is a percentage of total RAM or total swap, except the
# *_secs / grace / cooldown values, which are seconds. Check where you stand
# right now, and who is first in line, with:
#
#     oom-defender --status

# --- Tier 1: freeze -------------------------------------------------------
# SIGSTOP the best candidate (see "Who gets picked" below). Both conditions
# must hold together: low memory on its own is normal on a 3.4 GB machine as
# long as swap has somewhere to go.
freeze_mem_pct = 10
freeze_swap_pct = 25

# Freezing one process rarely ends an episode by itself. Up to max_frozen may
# be suspended, one every freeze_interval seconds, before the grace period
# runs out and something gets killed instead. Four idle processes suspended in
# sequence is a much gentler way out than one big kill.
max_frozen = 4
freeze_interval = 3

# --- Tier 2: kill ---------------------------------------------------------
kill_mem_pct = 5
kill_swap_pct = 12

# --- Thrash detection -----------------------------------------------------
# Memory PSI "full avg10" — the percentage of the last 10 seconds in which
# every task was stalled waiting on memory. This is the trigger that matters
# once there is a big swapfile: swap never runs out, the machine just stops
# responding. The *_secs values are how long the figure has to stay there.
freeze_psi = 15
freeze_psi_secs = 10
kill_psi = 40
kill_psi_secs = 20

# --- Recovery -------------------------------------------------------------
# Resume frozen processes once memory is back above this. Well clear of
# freeze_mem_pct on purpose — releasing at the line we froze at just freezes
# again a second later.
release_mem_pct = 20

# How long a freeze gets to produce a recovery before the defender escalates
# to a kill. The victim is re-picked at that point, not inherited.
freeze_grace = 20

# The escape hatch out of a long freeze. Memory on this machine sits between
# freeze_mem_pct and release_mem_pct for long stretches: nothing is firing any
# more, but nothing has recovered enough to release either. On 2026-08-11 that
# gap kept a Firefox content process suspended for eleven minutes. Past this
# many seconds, with neither trigger active, it is released regardless — a
# second stutter later is much cheaper than a hang you are sitting in front of.
freeze_max_secs = 90

# Quiet period after a kill. PSI averages lag by several seconds, so without
# this one runaway process costs you three.
kill_cooldown = 10

# --- Victim eligibility ---------------------------------------------------
# Never touch a process smaller than this, whatever it scores. Two dozen D-Bus
# session services here ship with oom_score_adj=200 while being 3-8 MB each,
# which the kernel's own badness formula ranks *above* a 500 MB browser.
# Freeing 5 MB does not end an OOM; it breaks the trash icon and leaves the
# real hog running.
min_victim_mb = 96

# --- Who gets picked ------------------------------------------------------
# The biggest process is the wrong answer. Watching a video with twenty idle
# tabs behind it, the video is probably the largest thing on the machine, and
# freezing it to save tabs nobody is looking at gets the trade backwards.
#
# Candidates are ordered by attention first, then by whether they look in use,
# and only then by size. The focused window's PID comes from the window
# manager (via xprop); the group around it grows down through its children and
# up through its parents, stopping at the first name in `protect` — which is
# what keeps a browser's content processes with the browser instead of walking
# out into xfce4-session and protecting the entire desktop.
#
# See the ordering for yourself, with the focused app marked, using:
#     oom-defender --status
#
# 0 turns all of this off and ranks purely by size.
focus_aware = 1
focus_poll = 2

# CPU percent (of one core) above which a process counts as in use and is
# passed over in favour of an idle one of the same size. Something burning CPU
# *and* growing is the runaway rather than a video, and stays a candidate;
# growth_min_kb (kB/s) is where that line sits.
busy_cpu_pct = 8
growth_min_kb = 512

# Rank on the size a process is heading for, this many seconds ahead, rather
# than the size it has now. A process taking 40 MB/s is the reason the machine
# is in trouble; one sitting on 400 MB since this morning is merely large.
growth_lookahead = 10

# Killing is not freezing. A freeze is reversible and costs a stutter, so it
# always goes to something you are not using, however small. A kill throws
# work away, so it has to land on something big enough to end the episode —
# destroying a 400 MB background job will not rescue a machine being held down
# by 2 GB elsewhere. Focus is a bias at the kill tier rather than a veto: 3
# means a process in the focused app must be four times the size before it is
# preferred. 0 removes the protection when killing; raise it to make the app
# you are in effectively untouchable.
kill_focus_bias = 3

# Minimum gap between full /proc sweeps. The tick rate rises to 10 Hz under
# pressure, and re-walking every process that often would make the watchdog a
# load in its own right.
scan_interval = 0.5

# --- Protected processes --------------------------------------------------
# Never frozen, never killed. Matched on the first 15 characters of the
# process name, because that is all the kernel keeps. Anything with an
# oom_score_adj at or below -900 is also skipped, so per-process opt-out works
# without editing this list:
#
#     sudo choom -p <pid> -n -900        # protect a running process
#     choom -n 500 -- some-command       # volunteer a command as a victim
#
# Add your own here. Losing an editor to a kill hurts more than losing a
# browser tab, so an unsaved-work app is a reasonable thing to protect.
protect = systemd,systemd-journald,systemd-logind,systemd-udevd,systemd-resolved,systemd-timesyncd,systemd-userdbd,systemd-oomd,init,dbus-broker,dbus-broker-launch,dbus-daemon,polkitd,accounts-daemon,NetworkManager,wpa_supplicant,bluetoothd,sshd,agetty,login,Xorg,lightdm,xfce4-session,xfwm4,xfsettingsd,xfce4-panel,xfdesktop,xfconfd,xfce4-notifyd,xfce4-power-manager,pipewire,pipewire-pulse,wireplumber,pulseaudio,upowerd,udisksd,oom-defender

# --- Testing --------------------------------------------------------------
# 1 = decide and log, but never actually signal anything.
dry_run = 0
